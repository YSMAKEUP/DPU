spring:
  datasource:
    # RDS 엔드포인트 주소와 DB 이름(dpu)이 포함된 URL입니다.
    url: jdbc:mysql://database-2.cbos0ewmiuav.ap-northeast-2.rds.amazonaws.com:3306/dpu?useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: admin
    password: "admin1234"

  jpa:
    hibernate:
      # 서버 실행 시 엔티티 변경 사항을 테이블에 자동으로 반영합니다.
      ddl-auto: update
    properties:
      hibernate:
        # MySQL 버전에 맞는 Dialect 설정입니다.
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  session:
    timeout: 30m

  thymeleaf:
    # 운영 환경에서는 성능을 위해 캐시를 true로 설정하는 것이 일반적입니다.
    cache: true

  security:
    user:
      name: test
      password: test

server:
  # EC2에서 8081 포트로 실행하기 위한 기본 설정입니다.
  port: 8081